name: Terraform Plan

on:
  pull_request:
     branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get OIDC Token
        id: get-token
        run: |
          token=$(curl -s -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -X POST \
            "https://api.github.com/app/installations/${{ github.event.pull_request.head.repo.owner.id }}/access_tokens" \
            -d "{\"permissions\": {\"id_token\": \"read\"}}" | jq -r '.token // empty')
          
          # Alternative: Use GitHub's OIDC token endpoint
          token=$(curl -s -X POST "${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}" \
            -H "Accept: application/json" \
            -H "Authorization: bearer ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}" | jq -r '.value')
          
          echo "::add-mask::$token"
          echo "OIDC_TOKEN=$token" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          ARM_USE_OIDC: true
        
      - name: Terraform Plan
        run: terraform plan -var-file="env/dev.tfvars"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          ARM_USE_OIDC: true
